name: collect

# Collection is scheduled here rather than in the app so the cadence and the source list
# can change without a redeploy.
#
# Every run is short. A sweep of the catalogue and the status pages takes well under a
# minute, so each schedule below does its work and exits rather than holding a runner.
# GitHub delays scheduled runs at busy hours and occasionally skips one; that is fine
# here, since every sweep is independent and the archive only records what changed.
on:
  schedule:
    - cron: "*/30 * * * *"   # sweep: catalogue and status pages
    - cron: "41 */6 * * *"   # slow sources: hosts, price lists, lifecycle notices
    - cron: "17 3 * * *"     # daily signals
  workflow_dispatch:
    inputs:
      job:
        description: "sweep, slow, daily, once (everything), backfill (replay LiteLLM history), or rebuild-records"
        default: once

# One run at a time. A slow run and a sweep that land together queue instead of overlapping.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          OBSERVATORY_URL: https://ai-observatory.view.fast
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ github.event.inputs.job }}
        run: |
          set -u
          case "$SCHEDULE" in
            "*/30 * * * *") JOB=sweep ;;
            "41 */6 * * *") JOB=slow ;;
            "17 3 * * *") JOB=daily ;;
          esac
          case "$JOB" in
            sweep)
              node collector/fetch-and-post.mjs models
              node collector/fetch-and-post.mjs status
              ;;
            slow)
              node collector/fetch-and-post.mjs sources
              node collector/fetch-and-post.mjs lifecycle
              node collector/fetch-and-post.mjs hosts
              ;;
            daily)
              node collector/fetch-and-post.mjs daily
              ;;
            once)
              for job in models status sources lifecycle hosts; do
                node collector/fetch-and-post.mjs "$job"
              done
              ;;
            backfill)
              node collector/fetch-and-post.mjs backfill-litellm
              ;;
            rebuild-records)
              node collector/fetch-and-post.mjs rebuild-records
              ;;
            *)
              echo "unknown job: $JOB" >&2
              exit 2
              ;;
          esac
