name: collect

# Collection is scheduled here rather than in the app so the cadence and the source list
# can change without a redeploy.
#
# Short cron intervals are heavily delayed on GitHub, so instead of asking for a run every
# 30 minutes we ask for one every 6 hours and have it loop, sweeping every 30 minutes for
# just under the 6 hour job ceiling. Four well-honoured triggers a day beat 48 poorly
# honoured ones.
on:
  schedule:
    - cron: "0 */6 * * *"    # long-running sweep loop
    - cron: "17 3 * * *"     # daily signals
  workflow_dispatch:
    inputs:
      job:
        description: "sweep (loop for ~6h), once (single sweep of everything), daily, backfill (replay LiteLLM history, run once), or rebuild-records (run once)"
        default: once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          OBSERVATORY_URL: https://ai-observatory.view.fast
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ github.event.inputs.job }}
        run: |
          set -u
          if [ "$SCHEDULE" = "17 3 * * *" ] || [ "$JOB" = "daily" ]; then
            node collector/fetch-and-post.mjs daily
            exit 0
          fi
          if [ "$JOB" = "backfill" ]; then
            node collector/fetch-and-post.mjs backfill-litellm
            exit 0
          fi
          if [ "$JOB" = "rebuild-records" ]; then
            node collector/fetch-and-post.mjs rebuild-records
            exit 0
          fi
          if [ "$JOB" = "once" ]; then
            node collector/fetch-and-post.mjs models
            node collector/fetch-and-post.mjs status
            node collector/fetch-and-post.mjs sources
            node collector/fetch-and-post.mjs lifecycle
            node collector/fetch-and-post.mjs hosts
            exit 0
          fi
          # The slower-moving sources change daily at most; once per six-hour job is plenty.
          node collector/fetch-and-post.mjs sources || true
          node collector/fetch-and-post.mjs lifecycle || true
          node collector/fetch-and-post.mjs hosts || true
          # Sweep loop: ~11 sweeps over ~5h30m, then let the next trigger take over.
          end=$(( $(date +%s) + 5*3600 + 30*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            node collector/fetch-and-post.mjs models || true
            node collector/fetch-and-post.mjs status || true
            sleep 1800
          done
